# ══════════════════════════════════════════════════════════════════
#  FlowTera — Üretim Docker Compose
#  Kullanım: docker compose -f docker-compose.prod.yml up -d --build
#
#  UYARI: Tüm ${...} değişkenleri ortam dosyasından veya
#  CI/CD secret'larından gelmelidir. Varsayılan değer YOK.
# ══════════════════════════════════════════════════════════════════

services:

  # PostgreSQL 
  postgres:
    image: postgres:16-alpine
    container_name: flowtera_postgres
    restart: always
    environment:
      POSTGRES_DB:       ${POSTGRES_DB}
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 256M
    # Dışarıya açma — prod'da direkt erişim olmamalı
    # Gerekirse VPN üzerinden tunnel kullanın

  # Redis
  redis:
    image: redis:7-alpine
    container_name: flowtera_redis
    restart: always
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 192M

  # Node Core Service 
  node-core:
    build:
      context: .
      dockerfile: node-core-service/Dockerfile
    image: flowtera/node-core:${IMAGE_TAG:-latest}
    container_name: flowtera_node_core
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV:       production
      PORT:           3001
      DATABASE_URL:   postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?pool_timeout=20&connection_limit=20
      REDIS_URL:      redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET:     ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      CORS_ORIGIN:    ${CORS_ORIGIN}
      AWS_REGION:           ${AWS_REGION}
      AWS_ACCESS_KEY_ID:    ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      S3_BUCKET_NAME:       ${S3_BUCKET_NAME}
      STRIPE_SECRET_KEY:     ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      SMTP_HOST:    ${SMTP_HOST}
      SMTP_PORT:    ${SMTP_PORT}
      SMTP_USER:    ${SMTP_USER}
      SMTP_PASS:    ${SMTP_PASS}
      FROM_EMAIL:   ${FROM_EMAIL}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
        reservations:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # Python ML Service
  python-ml:
    build:
      context: python-ml-service/
      dockerfile: Dockerfile
    image: flowtera/python-ml:${IMAGE_TAG:-latest}
    container_name: flowtera_python_ml
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL:     postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      GEMINI_API_KEY:   ${GEMINI_API_KEY}
      OPENAI_API_KEY:   ${OPENAI_API_KEY}
      GEMINI_MODEL:     ${GEMINI_MODEL}
      OPENAI_MODEL:     ${OPENAI_MODEL}
      DB_POOL_MIN:      2
      DB_POOL_MAX:      10
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # API Gateway
  api-gateway:
    build:
      context: api-gateway/
      dockerfile: Dockerfile
    image: flowtera/api-gateway:${IMAGE_TAG:-latest}
    container_name: flowtera_api_gateway
    restart: always
    depends_on:
      node-core:
        condition: service_healthy
      python-ml:
        condition: service_healthy
    environment:
      NODE_ENV:             production
      PORT:                 3002
      NODE_SERVICE_URL:     http://node-core:3001
      PYTHON_SERVICE_URL:   http://python-ml:8000
      INTERNAL_API_KEY:     ${INTERNAL_API_KEY}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      RATE_LIMIT_MAX:       ${RATE_LIMIT_MAX:-60}
    ports:
      - "3002:3002"             # Nginx/Caddy bu porta proxy yapmalı
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3002/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  backend:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
